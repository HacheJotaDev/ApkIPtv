name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Get Flutter version
      run: flutter --version

    - name: Generate fresh Android files
      run: |
        # Create a fresh Flutter project in a separate directory
        cd /tmp
        flutter create --org com.xtream --project-name xtream_iptv fresh_project
        
        # Replace the Android directory in our project
        rm -rf $GITHUB_WORKSPACE/android
        cp -r /tmp/fresh_project/android $GITHUB_WORKSPACE/android
        
        # Update namespace and applicationId in build.gradle
        cd $GITHUB_WORKSPACE
        find android -name "*.gradle" -o -name "*.gradle.kts" | while read f; do
          sed -i 's/com\.example\.xtream_iptv/com.xtream.iptv/g' "$f"
          sed -i 's/com\/example\/xtream_iptv/com\/xtream\/iptv/g' "$f"
        done
        
        # Update compileSdk to 36 for media_kit
        find android -name "build.gradle" -o -name "build.gradle.kts" | while read f; do
          sed -i 's/compileSdk = .*/compileSdk = 36/' "$f" 2>/dev/null || true
          sed -i 's/targetSdk = .*/targetSdk = 36/' "$f" 2>/dev/null || true
          sed -i 's/minSdk = .*/minSdk = 21/' "$f" 2>/dev/null || true
        done
        
        # Update AndroidManifest.xml files
        find android -name "AndroidManifest.xml" | while read f; do
          sed -i 's/com\.example\.xtream_iptv/com.xtream.iptv/g' "$f"
          sed -i 's/xtream_iptv/XTREAM IPTV/g' "$f"
        done
        
        # Fix MainActivity package
        mkdir -p android/app/src/main/kotlin/com/xtream/iptv
        if [ -f android/app/src/main/kotlin/com/example/xtream_iptv/MainActivity.kt ]; then
          mv android/app/src/main/kotlin/com/example/xtream_iptv/MainActivity.kt android/app/src/main/kotlin/com/xtream/iptv/MainActivity.kt
          sed -i 's/com\.example\.xtream_iptv/com.xtream.iptv/' android/app/src/main/kotlin/com/xtream/iptv/MainActivity.kt
          rm -rf android/app/src/main/kotlin/com/example
        elif [ -f android/app/src/main/kotlin/com/example/xtream_iptv/MainActivity.kt ]; then
          # Maybe it's .kt format
          mv android/app/src/main/kotlin/com/example/xtream_iptv/MainActivity.kt android/app/src/main/kotlin/com/xtream/iptv/MainActivity.kt
          sed -i 's/com\.example\.xtream_iptv/com.xtream.iptv/' android/app/src/main/kotlin/com/xtream/iptv/MainActivity.kt
          rm -rf android/app/src/main/kotlin/com/example
        fi
        
        # Add usesCleartextTraffic for HTTP streams
        sed -i 's/android:label/android:usesCleartextTraffic="true"\n        android:label/' android/app/src/main/AndroidManifest.xml
        
        echo "=== Final android/app/build.gradle ==="
        cat android/app/build.gradle
        echo "=== Final android/settings.gradle ==="
        cat android/settings.gradle
        echo "=== Final android/build.gradle ==="
        cat android/build.gradle

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: xtream-iptv-apk
        path: build/app/outputs/flutter-apk/app-release.apk
