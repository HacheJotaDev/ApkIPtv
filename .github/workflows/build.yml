name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Get Flutter version
      run: flutter --version

    - name: Create fresh project and overlay code
      run: |
        # Save our app code
        cp -r lib /tmp/lib_backup
        cp pubspec.yaml /tmp/pubspec_backup.yaml
        cp -r assets /tmp/assets_backup 2>/dev/null || true
        
        # Go to temp dir and create fresh Flutter project
        cd /tmp
        flutter create --org com.xtream --project-name xtream_iptv fresh_project
        
        # Show what was generated
        echo "=== Generated build.gradle ==="
        cat /tmp/fresh_project/android/app/build.gradle
        echo "=== Generated settings.gradle ==="
        cat /tmp/fresh_project/android/settings.gradle
        echo "=== Generated root build.gradle ==="
        cat /tmp/fresh_project/android/build.gradle
        echo "=== Generated gradle-wrapper.properties ==="
        cat /tmp/fresh_project/android/gradle/wrapper/gradle-wrapper.properties

    - name: Replace Android files with fresh ones
      run: |
        # Replace the entire android directory
        rm -rf android
        cp -r /tmp/fresh_project/android .
        
        # Customize for our app
        # Update app label
        sed -i 's/xtream_iptv/XTREAM IPTV/g' android/app/src/main/AndroidManifest.xml
        
        # Update compileSdk and targetSdk to 36 for media_kit
        if grep -q 'compileSdk' android/app/build.gradle; then
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle
        fi
        if grep -q 'targetSdk' android/app/build.gradle; then
          sed -i 's/targetSdk = .*/targetSdk = 36/' android/app/build.gradle
        fi
        if grep -q 'minSdk' android/app/build.gradle; then
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle
        fi

        # Move MainActivity to our package
        mkdir -p android/app/src/main/kotlin/com/xtream/iptv
        if [ -f android/app/src/main/kotlin/com/example/xtream_iptv/MainActivity.kt ]; then
          mv android/app/src/main/kotlin/com/example/xtream_iptv/MainActivity.kt android/app/src/main/kotlin/com/xtream/iptv/MainActivity.kt
          # Fix package name
          sed -i 's/com.example.xtream_iptv/com.xtream.iptv/' android/app/src/main/kotlin/com/xtream/iptv/MainActivity.kt
          rm -rf android/app/src/main/kotlin/com/example
        fi
        
        # Also fix any debug/profile manifests
        for manifest in android/app/src/debug/AndroidManifest.xml android/app/src/profile/AndroidManifest.xml; do
          if [ -f "$manifest" ]; then
            sed -i 's/com.example.xtream_iptv/com.xtream.iptv/g' "$manifest"
          fi
        done

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: xtream-iptv-apk
        path: build/app/outputs/flutter-apk/app-release.apk
