name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Show Flutter version
      run: flutter --version

    - name: Create fresh Flutter project for Android files
      run: |
        cd /tmp
        flutter create --org com.xtream --project-name xtream_iptv fresh_xtream
        
        # Print generated files for debugging
        echo "====== GENERATED settings.gradle ======"
        cat /tmp/fresh_xtream/android/settings.gradle 2>/dev/null || cat /tmp/fresh_xtream/android/settings.gradle.kts
        echo ""
        echo "====== GENERATED app build.gradle ======"
        cat /tmp/fresh_xtream/android/app/build.gradle 2>/dev/null || cat /tmp/fresh_xtream/android/app/build.gradle.kts
        echo ""
        echo "====== GENERATED root build.gradle ======"
        cat /tmp/fresh_xtream/android/build.gradle 2>/dev/null || cat /tmp/fresh_xtream/android/build.gradle.kts
        echo ""
        echo "====== GENERATED gradle-wrapper.properties ======"
        cat /tmp/fresh_xtream/android/gradle/wrapper/gradle-wrapper.properties
        echo ""
        echo "====== GENERATED AndroidManifest.xml ======"
        cat /tmp/fresh_xtream/android/app/src/main/AndroidManifest.xml
        echo ""
        echo "====== GENERATED MainActivity ======"
        find /tmp/fresh_xtream/android -name "MainActivity.*" -exec cat {} \;

    - name: Replace Android files
      run: |
        rm -rf android
        cp -r /tmp/fresh_xtream/android .
        
        # Fix package names
        find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.xml" -o -name "*.kt" -o -name "*.java" \) | while read f; do
          sed -i 's/com\.example\.xtream_iptv/com.xtream.iptv/g' "$f" 2>/dev/null || true
          sed -i 's/com\/example\/xtream_iptv/com\/xtream\/iptv/g' "$f" 2>/dev/null || true
        done
        
        # Update SDK versions for media_kit
        find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) | while read f; do
          sed -i 's/compileSdk = .*/compileSdk = 36/' "$f" 2>/dev/null || true
          sed -i 's/targetSdk = .*/targetSdk = 36/' "$f" 2>/dev/null || true
          sed -i 's/minSdk = .*/minSdk = 21/' "$f" 2>/dev/null || true
        done
        
        # Fix app label
        sed -i 's/xtream_iptv/XTREAM IPTV/' android/app/src/main/AndroidManifest.xml
        
        # Add cleartext traffic
        sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
        
        # Fix directory structure for our package
        mkdir -p android/app/src/main/kotlin/com/xtream/iptv
        old_main=$(find android -path "*/kotlin/com/example/xtream_iptv/MainActivity.kt" 2>/dev/null)
        if [ -n "$old_main" ]; then
          mv "$old_main" android/app/src/main/kotlin/com/xtream/iptv/MainActivity.kt
          rm -rf android/app/src/main/kotlin/com/example
        fi

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: xtream-iptv-apk
        path: build/app/outputs/flutter-apk/app-release.apk
